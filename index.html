<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formula Straight — Quick Race</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="brand-row">
            <div class="brand-mark">FS</div>
            <div>
                <h1>FORMULA STRAIGHT</h1>
                <p class="brand-kicker">PURE SPEED. ONE STRAIGHT. NO EXCUSES.</p>
            </div>
        </div>
        <canvas id="gameCanvas" width="1200" height="600"></canvas>
        <div class="controls-info">
            <p><strong>RACE CONTROLS</strong></p>
            <ul>
                <li><span>1P WASD / ↑ ↓ ← →</span> ドライブ</li>
                <li><span>Multi P1 WASD / P2 ↑ ↓ ← →</span></li>
                <li><span>P3 IJKL / P4 NUM 8 5 4 6</span></li>
                <li><span>DRS</span> 検知時に自動作動</li>
                <li><span>SPACE</span> リプレイを一時停止</li>
            </ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
